name: ThunderYellow LeafGreen Checkpoint 1

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - "src/title_screen.c"
      - "graphics/title_screen/**"
      - ".github/workflows/build-checkpoint-1.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential git libpng-dev
      - name: Build LeafGreen v1.1
        run: make -j2 leafgreen_rev1
      - name: Locate ROM
        run: find . -maxdepth 2 -type f -name "*.gba" -print
      - name: Upload Delta test ROM
        uses: actions/upload-artifact@v4
        with:
          name: ThunderYellow-LeafGreen-Checkpoint1
          path: "*.gba"
          if-no-files-found: error
