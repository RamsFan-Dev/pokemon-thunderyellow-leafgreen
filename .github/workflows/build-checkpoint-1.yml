name: ThunderYellow LeafGreen Checkpoint 1

on:
  workflow_dispatch:
  push:
    branches: [ main, checkpoint1-test8-verified, checkpoint1-audio-work, checkpoint2-full-national-dex ]
    paths:
      - "src/title_screen.c"
      - "src/data/wild_encounters.json"
      - "src/pokedex.c"
      - "data/text/pokedex_rating.inc"
      - "data/maps/PalletTown_ProfessorOaksLab/scripts.inc"
      - "src/data/thunderyellow_supplemental_mons.h"
      - "src/wild_encounter.c"
      - "sound/direct_sound_samples/**"
      - "sound/cry_tables.inc"
      - "include/sound.h"
      - "src/sound.c"
      - "graphics/title_screen/**"
      - ".github/workflows/build-checkpoint-1.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Checkout agbcc
        uses: actions/checkout@v4
        with:
          path: agbcc
          repository: pret/agbcc
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y gcc-arm-none-eabi binutils-arm-none-eabi libpng-dev
      - name: Install agbcc
        run: |
          ./build.sh
          ./install.sh ../
        working-directory: ./agbcc
      - name: Build LeafGreen v1.1
        run: make -j2 leafgreen_rev1
      - name: Locate ROM
        run: find . -maxdepth 1 -type f -name "*.gba" -print
      - name: Upload Delta test ROM
        uses: actions/upload-artifact@v4
        with:
          name: ThunderYellow-LeafGreen-Checkpoint1
          path: "*.gba"
          if-no-files-found: error
