name: ThunderYellow LeafGreen Checkpoint

on:
  push:
    branches: [ main ]
  workflow_dispatch:

# checkpoint-1 PR artifact bridge

jobs:
  build-leafgreen-rev1:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ThunderYellow
        uses: actions/checkout@v4

      - name: Checkout agbcc
        uses: actions/checkout@v4
        with:
          repository: pret/agbcc
          path: agbcc

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential binutils-arm-none-eabi libpng-dev

      - name: Install agbcc
        working-directory: agbcc
        run: |
          ./build.sh
          ./install.sh ../

      - name: Build LeafGreen v1.1
        run: make -j2 leafgreen_rev1

      - name: Stage Delta ROM
        run: cp pokeleafgreen_rev1.gba ThunderYellow-LeafGreen-Checkpoint1.gba

      - name: Upload Delta test ROM
        uses: actions/upload-artifact@v4
        with:
          name: ThunderYellow-LeafGreen-Checkpoint1
          path: ThunderYellow-LeafGreen-Checkpoint1.gba
          if-no-files-found: error
